name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["StationMasterAPK_project.zip"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q StationMasterAPK_project.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --no-daemon
        working-directory: StationMasterAPK
      - name: Publish APK as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp StationMasterAPK/app/build/outputs/apk/debug/app-debug.apk StationMaster.apk
          gh release create "v${{ github.run_number }}" StationMaster.apk --title "Station Master v${{ github.run_number }}" --notes "Debug APK, Android 15"
